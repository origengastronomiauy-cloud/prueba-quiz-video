<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiencia ORIGEN</title>
    <style>
      /* --- ESTÉTICA PREMIUM & GLASSMORPHISM --- */
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background: #060608;
        background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #060608 80%);
        color: #ffffff;      
        text-align: center; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
      }
      
      .container { 
        background: rgba(20, 20, 25, 0.7);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 40px 30px; 
        border-radius: 24px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); 
        width: 100%; 
        max-width: 450px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .pantalla { animation: fadeIn 0.4s ease-out forwards; }
      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      
      .logo { width: 220px; margin-bottom: 25px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

      /* --- ANIMACIÓN DE CARGA (GLOW) --- */
      .logo-glow {
        width: 200px;
        margin-bottom: 30px;
        animation: pulseGlow 1.5s infinite alternate ease-in-out;
      }
      
      @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 5px rgba(223, 183, 99, 0.3)); transform: scale(1); }
        100% { filter: drop-shadow(0 0 25px rgba(223, 183, 99, 0.9)); transform: scale(1.05); }
      }

      .spinner-text {
        color: #d8b05c;
        font-size: 15px;
        letter-spacing: 3px;
        text-transform: uppercase;
        animation: blink 1.5s infinite;
      }

      @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

      h3 { font-family: 'Georgia', serif; font-size: 26px; margin: 0 0 20px 0; font-weight: 400; letter-spacing: 0.5px; }
      
      /* --- BOTONES PRINCIPALES --- */
      .btn { 
        display: block; width: 100%; padding: 16px; margin: 10px auto; border: none; border-radius: 14px; 
        cursor: pointer; font-weight: 600; background: linear-gradient(135deg, #dfb763 0%, #c29543 100%); 
        color: #0b0b0e; transition: transform 0.1s ease, box-shadow 0.3s ease; font-size: 16px; box-sizing: border-box;
        box-shadow: 0 4px 15px rgba(223, 183, 99, 0.2); -webkit-tap-highlight-color: transparent; text-decoration: none;
      }
      .btn:active { transform: scale(0.96); box-shadow: 0 2px 5px rgba(223, 183, 99, 0.1); }
      .btn:disabled { opacity: 0.6; pointer-events: none; }
      
      /* --- BOTONES DE TRIVIA --- */
      .btn-opcion {
        background: rgba(255,255,255,0.03); color: #e0e0e0; border: 1px solid rgba(255,255,255,0.08); font-weight: normal;
        box-shadow: none; text-align: left; padding: 18px 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px;
      }
      .btn-opcion:active { background: rgba(255,255,255,0.08); border-color: #d8b05c; }
      .letra-opcion { color: #d8b05c; font-weight: bold; font-size: 18px; min-width: 25px; }
      
      input { 
        width: 100%; padding: 18px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); background-color: rgba(0,0,0,0.3); 
        color: #ffffff; border-radius: 14px; box-sizing: border-box; text-align: center; font-size: 16px; outline: none; transition: all 0.3s ease;
      }
      input::placeholder { color: #888899; }
      input:focus { border-color: #d8b05c; background-color: rgba(0,0,0,0.5); box-shadow: 0 0 0 2px rgba(216, 176, 92, 0.2); }
      
      /* --- TARJETAS DE PREMIOS (NUEVO DISEÑO CON GLOW) --- */
      .premios-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 25px 0; }
      
      .premio-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;
        padding: 10px; cursor: pointer; transition: transform 0.1s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }
      /* Efecto Glow al presionar */
      .premio-item:active {
        transform: scale(0.92);
        border-color: #d8b05c;
        box-shadow: 0 0 20px rgba(223, 183, 99, 0.7);
        background: rgba(223, 183, 99, 0.1);
      }
      .premio-img { 
        width: 100px; height: 100px; object-fit: cover; border-radius: 10px; margin-bottom: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .premio-label { color: #d8b05c; font-size: 14px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
      
      .premio-final { width: 220px; height: 220px; object-fit: cover; border-radius: 24px; margin: 20px auto; display: block; border: 4px solid #d8b05c; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      
      /* --- BARRA DE PROGRESO --- */
      .progress-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 25px; overflow: hidden; }
      .progress-bar { height: 100%; background: linear-gradient(135deg, #dfb763 0%, #c29543 100%); width: 0%; transition: width 0.5s ease-out; }
      
      .msg { color: #ff5252; font-weight: 500; margin-bottom: 15px; min-height: 20px; }
      .oculto { display: none !important; }
    </style>
  </head>
  <body>
    
    <div class="container">
      
      <!-- PANTALLA 1: LOGIN -->
      <div id="pantalla-login" class="pantalla">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" alt="Logo ORIGEN">
        <h3 id="titulo-login">Acceso</h3>
        <input type="text" id="clave" placeholder="Ingresa tu código...">
        <div id="msg" class="msg"></div>
        <button class="btn" id="btn-acceder" onclick="iniciar()">Acceder</button>
      </div>

      <!-- PANTALLA 1.5: CARGA (GLOW) -->
      <div id="pantalla-carga" class="pantalla oculto">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo-glow" alt="Cargando ORIGEN">
        <div class="spinner-text">Validando acceso...</div>
      </div>

      <!-- PANTALLA 2: REPRODUCTOR DE VIDEO -->
      <div id="pantalla-video" class="pantalla oculto">
        <div id="video-container"></div>
      </div>

      <!-- PANTALLA 3: INSTRUCCIONES -->
      <div id="pantalla-instrucciones" class="pantalla oculto">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" style="width:150px; margin-bottom:15px;" alt="Logo ORIGEN">
        <h3 style="color: #d8b05c;">¡Trivia!</h3>
        <p style="color: #aaa; margin-bottom: 25px;">Si acertás todas las preguntas, tenés un premio.</p>
        <button class="btn" onclick="mostrarTrivia()">Comenzar Trivia</button>
      </div>

      <!-- PANTALLA 4: TRIVIA -->
      <div id="pantalla-trivia" class="pantalla oculto">
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <h3 id="pregunta-texto" style="font-size: 20px; line-height: 1.4; margin-bottom: 30px;"></h3>
        <div id="opciones-botones"></div>
      </div>

      <!-- PANTALLA 5: PREMIOS -->
      <div id="pantalla-premios" class="pantalla oculto">
        <h3 style="color: #d8b05c;">¡Felicitaciones!</h3>
        <p style="color: #ddd;">Acertaste todo. Elige tu premio:</p>
        
        <div class="premios-grid">
          <!-- Tarjeta 1: Uvita -->
          <div class="premio-item" onclick="finalizar('Uvita', 'https://res.cloudinary.com/f8l7nucq/image/upload/v1784051080/two-dark-alcoholic-drinks-on-rustic-wooden-table-2026-03-24-02-58-58-utc_qf7qfq.jpg')">
            <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784051080/two-dark-alcoholic-drinks-on-rustic-wooden-table-2026-03-24-02-58-58-utc_qf7qfq.jpg" class="premio-img" alt="Uvita">
            <div class="premio-label">Uvita</div>
          </div>
          
          <!-- Tarjeta 2: Fainá -->
          <div class="premio-item" onclick="finalizar('Fainá', 'https://res.cloudinary.com/f8l7nucq/image/upload/v1784051076/pepperoni-pizza-freshly-sliced-and-ready-to-eat-2026-03-17-04-06-54-utc_ypzkdm.jpg')">
            <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784051076/pepperoni-pizza-freshly-sliced-and-ready-to-eat-2026-03-17-04-06-54-utc_ypzkdm.jpg" class="premio-img" alt="Fainá">
            <div class="premio-label">Fainá</div>
          </div>

          <!-- Tarjeta 3: Café -->
          <div class="premio-item" onclick="finalizar('Café', 'https://res.cloudinary.com/f8l7nucq/image/upload/v1784051065/shekel-money-bag-and-shield-on-blue-background-2026-03-24-14-14-10-utc_sotjxd.jpg')">
            <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784051065/shekel-money-bag-and-shield-on-blue-background-2026-03-24-14-14-10-utc_sotjxd.jpg" class="premio-img" alt="Café">
            <div class="premio-label">Café</div>
          </div>
        </div>
      </div>
      
      <!-- PANTALLA ERROR -->
      <div id="pantalla-error" class="pantalla oculto">
        <h3>Casi lo logras...</h3>
        <p id="texto-error" style="color: #d8b05c; font-size: 18px; font-weight: bold; margin: 15px 0;"></p>
        <p style="color: #aaa; margin-bottom: 25px;">Para obtener un premio, necesitas acertar todas las preguntas.</p>
        <button class="btn" onclick="location.reload()">Volver a intentar</button>
      </div>

      <!-- PANTALLA FINAL (DESCARGA) -->
      <div id="pantalla-final" class="pantalla oculto">
        <h3 id="texto-final" style="color: #d8b05c;"></h3>
        <img id="img-final" src="" class="premio-final" alt="Tu Premio">
        <a id="btn-descarga" href="" download="Premio_Origen.jpg" class="btn">Preparando premio...</a>
      </div>

    </div>

    <script>
      // ==========================================
      // PEGA AQUÍ LA URL NUEVA DE TU APPS SCRIPT
      const API_URL = "https://script.google.com/macros/s/AKfycbwvX-iISjkAofxKTCSR_6LVu9ZsXHaSjZPMLNSw-epxxAtiqOORxOZORAgeB-w2MUpJtw/exec";
      // ==========================================

      var preguntas = []; var indice = 0; var aciertos = 0; var clave = "";

      const urlParams = new URLSearchParams(window.location.search);
      const urlParada = urlParams.get('parada') || "";
      const urlModo = urlParams.get('modo') || "";

      window.addEventListener('DOMContentLoaded', () => {
        if (urlParada === "" && urlModo === "") {
          document.getElementById('pantalla-login').innerHTML = `
            <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" alt="Logo ORIGEN">
            <h3 style="color: #d8b05c; margin-top: 10px;">Escaneo Requerido</h3>
            <p style="color: #aaa; margin-bottom: 25px; font-size: 15px; line-height: 1.5;">Para vivir la experiencia ORIGEN, debes escanear el código QR oficial de tu mesa o parada.</p>
          `;
        }
      });

      function vibrar(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

      function mostrar(id) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('oculto'));
        document.getElementById(id).classList.remove('oculto');
      }

      async function peticionAPI(datos) {
        try {
          const respuesta = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(datos),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
          return await respuesta.json();
        } catch (e) {
          return { error: "Error de conexión con el servidor. Intenta de nuevo." };
        }
      }

      async function iniciar() {
        vibrar(30);
        clave = document.getElementById('clave').value;
        if(clave.trim() === "") { document.getElementById('msg').innerText = "Ingresa tu código."; return; }
        
        document.getElementById('msg').innerText = "";
        mostrar('pantalla-carga');

        const [res] = await Promise.all([
          peticionAPI({ accion: "validarClave", clave: clave, parada: urlParada, modo: urlModo }),
          new Promise(resolve => setTimeout(resolve, 1500))
        ]);
        
        render(res);
      }

      function render(res) {
        if (res.error) {
          vibrar([50, 50, 50]);
          mostrar('pantalla-login'); 
          document.getElementById('msg').style.color = "#ff5252";
          document.getElementById('msg').innerText = res.error;
          return;
        }
        
        if (res.tipo == "video") {
          var esIphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          var urlVideo = esIphone ? (res.urlIphone || res.url) : res.url;

          document.getElementById('video-container').innerHTML = `
            <h3 style="color: #d8b05c; text-transform: uppercase; font-size: 22px;">${res.lugar}</h3>
            <div style='border-radius:18px; overflow:hidden; background:#000; margin-bottom:20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);'>
              <video src='${urlVideo}' controls controlsList="nodownload" oncontextmenu="return false;" playsinline webkit-playsinline preload="metadata" width='100%'></video>
            </div>`;
          mostrar('pantalla-video');
            
        } else if (res.tipo == "trivia") {
          preguntas = res.data;
          mostrar('pantalla-instrucciones');
        }
      }

      function mostrarTrivia() {
        mostrar('pantalla-trivia');
        
        var porcentaje = (indice / preguntas.length) * 100;
        document.getElementById('progress-bar').style.width = porcentaje + "%";

        var p = preguntas[indice];
        var preguntaHTML = p.pregunta;
        var partes = p.pregunta.split(':');
        if (partes.length > 1) {
           preguntaHTML = "<span style='color: #d8b05c;'>" + partes[0] + ":</span>" + partes.slice(1).join(':');
        }
        document.getElementById('pregunta-texto').innerHTML = preguntaHTML;
        
        document.getElementById('opciones-botones').innerHTML =
          "<button class='btn btn-opcion' onclick='evaluar(this, \"A\",\""+p.correct+"\")'><span class='letra-opcion'>A)</span> " + p.A + "</button>" +
          "<button class='btn btn-opcion' onclick='evaluar(this, \"B\",\""+p.correct+"\")'><span class='letra-opcion'>B)</span> " + p.B + "</button>" +
          "<button class='btn btn-opcion' onclick='evaluar(this, \"C\",\""+p.correct+"\")'><span class='letra-opcion'>C)</span> " + p.C + "</button>";
      }

      function evaluar(btn, opc, correct) {
        vibrar(40); 
        var btns = document.getElementById('opciones-botones').querySelectorAll('.btn');
        btns.forEach(b => b.disabled = true);
        
        if (opc == correct) {
          aciertos++;
          btn.style.background = "rgba(39, 174, 96, 0.2)";
          btn.style.borderColor = "#27ae60";
          btn.querySelector('.letra-opcion').style.color = "#27ae60";
        } else {
          vibrar([40, 50, 40]); 
          btn.style.background = "rgba(231, 76, 60, 0.2)";
          btn.style.borderColor = "#e74c3c";
          btn.querySelector('.letra-opcion').style.color = "#e74c3c";
        }
        
        setTimeout(function() {
          indice++;
          if (indice < preguntas.length) {
            mostrarTrivia();
          } else {
            document.getElementById('progress-bar').style.width = "100%";
            setTimeout(mostrarSelector, 600);
          }
        }, 1000);
      }

      function mostrarSelector() {
        if (aciertos === preguntas.length) {
          mostrar('pantalla-premios');
        } else {
          mostrar('pantalla-error');
          document.getElementById('texto-error').innerText = "Obtuviste " + aciertos + " de " + preguntas.length + " aciertos.";
          peticionAPI({ accion: "guardarResultado", usuario: clave, aciertos: aciertos, premio: "Sin premio" });
        }
      }

      function finalizar(premio, url) {
        vibrar(40);
        peticionAPI({ accion: "guardarResultado", usuario: clave, aciertos: aciertos, premio: premio });
        mostrar('pantalla-final');
        document.getElementById('texto-final').innerText = "¡Has seleccionado: " + premio + "!";
        document.getElementById('img-final').src = url;
        
        generarImagenConVencimiento(url);
      }

      function generarImagenConVencimiento(urlOriginal) {
        const btnDescarga = document.getElementById('btn-descarga');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        img.crossOrigin = "Anonymous";
        
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          
          // Zócalo reducido al 5% del alto total, anclado al final exacto
          const altoZocalo = Math.max(25, canvas.height * 0.05);
          ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
          ctx.fillRect(0, canvas.height - altoZocalo, canvas.width, altoZocalo);
          
          const fecha = new Date();
          fecha.setMonth(fecha.getMonth() + 1);
          const fechaStr = fecha.toLocaleDateString('es-UY');
          
          // Letra achicada para adaptarse al nuevo zócalo fino
          const tamañoLetra = Math.max(12, canvas.width * 0.025);
          ctx.font = `bold ${tamañoLetra}px sans-serif`;
          ctx.fillStyle = "#dfb763";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          
          ctx.fillText(`VÁLIDO HASTA: ${fechaStr}`, canvas.width / 2, canvas.height - (altoZocalo / 2));
          
          const dataURL = canvas.toDataURL("image/jpeg", 0.9);
          btnDescarga.href = dataURL;
          btnDescarga.innerText = "Descargar Premio";
        };
        
        img.onerror = function() {
          btnDescarga.href = urlOriginal;
          btnDescarga.innerText = "Descargar Premio";
        };
        
        img.src = urlOriginal;
      }
    </script>
  </body>
</html>
