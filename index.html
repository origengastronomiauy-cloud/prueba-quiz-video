<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia ORIGEN</title>
    <style>
      /* --- ESTÉTICA PREMIUM & GLASSMORPHISM --- */
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background: #060608;
        /* Fondo con un sutil gradiente radial para darle profundidad */
        background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #060608 80%);
        color: #ffffff;      
        text-align: center; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
      }
      
      .container { 
        background: rgba(20, 20, 25, 0.7); /* Efecto cristal oscuro */
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 40px 30px; 
        border-radius: 24px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); 
        width: 100%; 
        max-width: 450px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
        /* Animación suave de entrada */
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      /* Transiciones suaves entre pantallas */
      .pantalla {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      
      .logo { width: 220px; margin-bottom: 25px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

      h3 {
        font-family: 'Georgia', serif;
        font-size: 26px;
        margin: 0 0 20px 0;
        font-weight: 400;
        letter-spacing: 0.5px;
      }
      
      .btn { 
        display: block; 
        width: 100%; 
        padding: 16px; 
        margin: 10px auto; 
        border: none; 
        border-radius: 14px; 
        cursor: pointer; 
        font-weight: 600; 
        background: linear-gradient(135deg, #dfb763 0%, #c29543 100%); 
        color: #0b0b0e; 
        transition: all 0.3s ease;
        text-decoration: none;
        font-size: 16px;
        box-sizing: border-box;
        box-shadow: 0 4px 15px rgba(223, 183, 99, 0.2);
      }
      .btn:hover { 
        background: linear-gradient(135deg, #ecd189 0%, #d6a751 100%); 
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(223, 183, 99, 0.3);
      }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
      
      input { 
        width: 100%; 
        padding: 18px; 
        margin-bottom: 20px; 
        border: 1px solid rgba(255,255,255,0.1); 
        background-color: rgba(0,0,0,0.3); 
        color: #ffffff;
        border-radius: 14px; 
        box-sizing: border-box; 
        text-align: center; 
        font-size: 16px; 
        outline: none;
        transition: all 0.3s ease;
      }
      input::placeholder { color: #888899; }
      input:focus { border-color: #d8b05c; background-color: rgba(0,0,0,0.5); box-shadow: 0 0 0 2px rgba(216, 176, 92, 0.2); }
      
      .premios-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 25px 0; }
      .premio-img { 
        width: 110px; height: 110px; object-fit: cover; border-radius: 14px; 
        cursor: pointer; border: 2px solid transparent; 
        transition: all 0.3s ease; background-color: rgba(0,0,0,0.5);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .premio-img:hover { border-color: #d8b05c; transform: scale(1.08); box-shadow: 0 8px 20px rgba(216, 176, 92, 0.3); }
      .premio-final { width: 220px; height: 220px; object-fit: cover; border-radius: 24px; margin: 20px auto; display: block; border: 4px solid #d8b05c; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      
      .msg { color: #ff5252; font-weight: 500; margin-bottom: 15px; min-height: 20px; }
      .oculto { display: none !important; }
    </style>
  </head>
  <body>
    
    <div class="container">
      
      <!-- PANTALLA 1: LOGIN -->
      <div id="pantalla-login" class="pantalla">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" alt="Logo ORIGEN">
        <h3>Acceso</h3>
        <input type="text" id="clave" placeholder="Ingresa tu código...">
        <div id="msg" class="msg"></div>
        <button class="btn" id="btn-acceder" onclick="iniciar()">Acceder</button>
      </div>

      <!-- PANTALLA 2: REPRODUCTOR DE VIDEO -->
      <div id="pantalla-video" class="pantalla oculto">
        <div id="video-container"></div>
      </div>

      <!-- PANTALLA 3: INSTRUCCIONES -->
      <div id="pantalla-instrucciones" class="pantalla oculto">
        <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784049017/Origen_logo_p1hlex.png" class="logo" style="width:150px; margin-bottom:15px;" alt="Logo ORIGEN">
        <h3>¡Trivia!</h3>
        <p style="color: #aaa; margin-bottom: 25px;">Si acertás todas las preguntas, tenés un premio.</p>
        <button class="btn" onclick="mostrarTrivia()">Comenzar Trivia</button>
      </div>

      <!-- PANTALLA 4: TRIVIA -->
      <div id="pantalla-trivia" class="pantalla oculto">
        <h3 id="pregunta-texto" style="font-size: 20px; line-height: 1.4; margin-bottom: 30px;"></h3>
        <div id="opciones-botones"></div>
      </div>

      <!-- PANTALLA 5: PREMIOS -->
      <div id="pantalla-premios" class="pantalla oculto">
        <h3 style="color: #d8b05c;">¡Felicitaciones!</h3>
        <p style="color: #ddd;">Acertaste todo. Elige tu premio:</p>
        <div class="premios-grid">
          <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784051080/two-dark-alcoholic-drinks-on-rustic-wooden-table-2026-03-24-02-58-58-utc_qf7qfq.jpg" class="premio-img" onclick="finalizar('Premio 1', this.src)">
          <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784051076/pepperoni-pizza-freshly-sliced-and-ready-to-eat-2026-03-17-04-06-54-utc_ypzkdm.jpg" class="premio-img" onclick="finalizar('Premio 2', this.src)">
          <img src="https://res.cloudinary.com/f8l7nucq/image/upload/v1784051065/shekel-money-bag-and-shield-on-blue-background-2026-03-24-14-14-10-utc_sotjxd.jpg" class="premio-img" onclick="finalizar('Premio 3', this.src)">
        </div>
      </div>
      
      <!-- PANTALLA ERROR -->
      <div id="pantalla-error" class="pantalla oculto">
        <h3>Casi lo logras...</h3>
        <p id="texto-error" style="color: #d8b05c; font-size: 18px; font-weight: bold; margin: 15px 0;"></p>
        <p style="color: #aaa; margin-bottom: 25px;">Para obtener un premio, necesitas acertar todas las preguntas.</p>
        <button class="btn" onclick="location.reload()">Volver a intentar</button>
      </div>

      <!-- PANTALLA FINAL (DESCARGA) -->
      <div id="pantalla-final" class="pantalla oculto">
        <h3 id="texto-final" style="color: #d8b05c;"></h3>
        <img id="img-final" src="" class="premio-final" alt="Tu Premio">
        <a id="btn-descarga" href="" download="Premio_Origen.jpg" class="btn">Descargar Premio</a>
      </div>

    </div>

    <script>
      // ==========================================
      // PEGA AQUÍ LA URL DE TU APPS SCRIPT (PASO 1)
      const API_URL = "https://script.google.com/macros/s/AKfycbwvX-iISjkAofxKTCSR_6LVu9ZsXHaSjZPMLNSw-epxxAtiqOORxOZORAgeB-w2MUpJtw/exec";
      // ==========================================

      var preguntas = []; var indice = 0; var aciertos = 0; var clave = "";

      // Capturar parámetros de la URL de GitHub (ej: ?parada=1&modo=trivia)
      const urlParams = new URLSearchParams(window.location.search);
      const urlParada = urlParams.get('parada') || "";
      const urlModo = urlParams.get('modo') || "";

      function mostrar(id) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('oculto'));
        document.getElementById(id).classList.remove('oculto');
      }

      // Conexión segura con Apps Script mediante fetch
      async function peticionAPI(datos) {
        try {
          const respuesta = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(datos),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain evita bloqueos CORS
          });
          return await respuesta.json();
        } catch (e) {
          return { error: "Error de conexión. Intenta de nuevo." };
        }
      }

      async function iniciar() {
        clave = document.getElementById('clave').value;
        if(clave.trim() === "") { document.getElementById('msg').innerText = "Ingresa tu código."; return; }
        
        document.getElementById('msg').style.color = "#d8b05c";
        document.getElementById('msg').innerText = "Validando...";
        document.getElementById('btn-acceder').disabled = true;

        // Llamamos al backend
        const res = await peticionAPI({ accion: "validarClave", clave: clave, parada: urlParada, modo: urlModo });
        
        document.getElementById('btn-acceder').disabled = false;
        render(res);
      }

      function render(res) {
        if (res.error) {
          document.getElementById('msg').style.color = "#ff5252";
          document.getElementById('msg').innerText = res.error;
          return;
        }
        
        if (res.tipo == "video") {
          var esIphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          var urlVideo = esIphone ? (res.urlIphone || res.url) : res.url;

          document.getElementById('video-container').innerHTML = `
            <h3>${res.lugar}</h3>
            <div style='border-radius:18px; overflow:hidden; background:#000; margin-bottom:20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);'>
              <video src='${urlVideo}' controls controlsList="nodownload" oncontextmenu="return false;" playsinline webkit-playsinline preload="metadata" width='100%'></video>
            </div>`;
          mostrar('pantalla-video');
            
        } else if (res.tipo == "trivia") {
          preguntas = res.data;
          mostrar('pantalla-instrucciones');
        }
      }

      function mostrarTrivia() {
        mostrar('pantalla-trivia');
        var p = preguntas[indice];
        document.getElementById('pregunta-texto').innerText = p.pregunta;
        document.getElementById('opciones-botones').innerHTML =
          "<button class='btn' style='background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); font-weight: normal; box-shadow: none;' onclick='evaluar(this, \"A\",\""+p.correct+"\")'>A) " + p.A + "</button>" +
          "<button class='btn' style='background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); font-weight: normal; box-shadow: none;' onclick='evaluar(this, \"B\",\""+p.correct+"\")'>B) " + p.B + "</button>" +
          "<button class='btn' style='background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); font-weight: normal; box-shadow: none;' onclick='evaluar(this, \"C\",\""+p.correct+"\")'>C) " + p.C + "</button>";
      }

      function evaluar(btn, opc, correct) {
        var btns = document.getElementById('opciones-botones').querySelectorAll('.btn');
        btns.forEach(b => b.disabled = true);
        
        if (opc == correct) {
          aciertos++;
          btn.style.background = "#27ae60";
          btn.style.borderColor = "#27ae60";
        } else {
          btn.style.background = "#e74c3c";
          btn.style.borderColor = "#e74c3c";
        }
        
        setTimeout(function() {
          indice++;
          if (indice < preguntas.length) mostrarTrivia();
          else mostrarSelector();
        }, 1000);
      }

      function mostrarSelector() {
        if (aciertos === preguntas.length) {
          mostrar('pantalla-premios');
        } else {
          mostrar('pantalla-error');
          document.getElementById('texto-error').innerText = "Obtuviste " + aciertos + " de " + preguntas.length + " aciertos.";
          peticionAPI({ accion: "guardarResultado", usuario: clave, aciertos: aciertos, premio: "Sin premio" });
        }
      }

      function finalizar(premio, url) {
        peticionAPI({ accion: "guardarResultado", usuario: clave, aciertos: aciertos, premio: premio });
        mostrar('pantalla-final');
        document.getElementById('texto-final').innerText = "¡Has seleccionado: " + premio + "!";
        document.getElementById('img-final').src = url;
        document.getElementById('btn-descarga').href = url;
      }
    </script>
  </body>
</html>
